spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5432/roomiq_booking}
    username: ${BOOKING_DB_USERNAME:roomiq}
    password: ${BOOKING_DB_PASSWORD:roomiq}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
server:
  port: ${BOOKING_SERVICE_PORT:8085}
roomiq:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  organization:
    url: ${ORGANIZATION_SERVICE_URL:http://localhost:8082}
  room:
    url: ${ROOM_SERVICE_URL:http://localhost:8083}
  scheduling:
    url: ${SCHEDULING_SERVICE_URL:http://localhost:8084}
  booking:
    share-token:
      key-ring: ${BOOKING_SHARE_TOKEN_KEY_RING:}
      active-key-version: ${BOOKING_SHARE_TOKEN_ACTIVE_KEY_VERSION:v1}
    event-relay:
      enabled: ${BOOKING_EVENT_RELAY_ENABLED:true}
      fixed-delay-ms: ${BOOKING_EVENT_RELAY_FIXED_DELAY_MS:1000}
      confirm-timeout-ms: ${BOOKING_EVENT_RELAY_CONFIRM_TIMEOUT_MS:3000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: INFO
    rw.rra.roomiq: INFO
