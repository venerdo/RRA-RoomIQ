spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: identity-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/RRA_RoomIQ}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Ushindi@123!}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

server:
  port: ${SERVER_PORT:8081}

roomiq:
  audit:
    relay:
      enabled: ${IDENTITY_AUDIT_RELAY_ENABLED:true}
      fixed-delay-ms: ${IDENTITY_AUDIT_RELAY_DELAY_MS:1000}
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    "[rw.rra.roomiq.identity]": DEBUG
