spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: ${ROOM_PHOTO_MAX_FILE_SIZE:5MB}
      max-request-size: ${ROOM_PHOTO_MAX_REQUEST_SIZE:6MB}
  application:
    name: room-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/RRA_RoomIQ}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: ${ROOM_SERVICE_PORT:8083}
organization:
  service:
    url: ${ORGANIZATION_SERVICE_URL:http://localhost:8082}
identity:
  service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:rra-roomiq/rooms}
room:
  photos:
    max-file-size-bytes: ${ROOM_PHOTO_MAX_FILE_SIZE_BYTES:5242880}
    max-count: ${ROOM_PHOTO_MAX_COUNT:10}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: INFO
    rw.rra.roomiq: INFO
