spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: organization-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/RRA_RoomIQ}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
roomiq:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
server:
  port: ${ORGANIZATION_SERVICE_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: INFO
    rw.rra.roomiq: INFO
